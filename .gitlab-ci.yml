workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - test
  - build
  - deploy

variables:
  GIT_DEPTH: "1"
  GIT_STRATEGY: fetch

# ─── TEST ────────────────────────────────────────────────────────────────────

lint:
  stage: test
  image: node:20-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── BUILD ───────────────────────────────────────────────────────────────────

build:check:
  stage: build
  image: docker:27
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  script:
    - docker build .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─── DEPLOY ──────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - tr -d '\r' < "$SSH_PRIVATE_KEY" > /tmp/deploy_key
    - echo "" >> /tmp/deploy_key
    - chmod 600 /tmp/deploy_key
    - ssh-add /tmp/deploy_key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p ${SSH_PORT:-22} $SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh -p ${SSH_PORT:-22} $SSH_USER@$SSH_HOST "
        cd $DEPLOY_PATH &&
        git checkout main &&
        git pull origin main &&
        docker compose up -d --build
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://portfolio.marcallie.duckdns.org
